services:
  app:
    build: .
    ports:
      - "127.0.0.1:8870:8770"
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      SEED_DEMO: ${SEED_DEMO:-1}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - workledger-data:/app/.data
    restart: unless-stopped
volumes:
  workledger-data:
